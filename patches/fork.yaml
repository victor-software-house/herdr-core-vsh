%YAML 1.2
---
schema: 1
downstream:
  remote: origin
  branch: downstream
  recovery_tag_prefix: forkctl/recovery
  publish: append
upstream:
  remote: upstream
  url: https://github.com/herdrdev/herdr-core.git
  fetch_ref: refs/heads/master
base:
  target:
    kind: tag
    selector: refs/tags/v0.1.16
    commit: e07c2a1bedd62cf4787ee026ee23ee79c7d95491
  canonical: e07c2a1bedd62cf4787ee026ee23ee79c7d95491
  stack: e07c2a1bedd62cf4787ee026ee23ee79c7d95491
documents:
  ledger: PATCHES.md
  exports: patches/downstream
bookkeeping_patch: fork-tooling
patches:
  - name: kitty-image-replay
    kind: source
    purpose: "Keep kitty images and their placements in the core, loading file, temporary-file and shared-memory media on the core's own machine and PNG through the png crate, and send viewers images, never names: a transmission by path reaches viewers as PNG, and every repaint (attach, reattach, catch-up, another machine) re-sends the stored images with their placements, on screen and in the history it replays. Screen snapshots keep the images too, so a core restart loses none: Ghostty is pinned past the commits that put kitty images and placements in its snapshots, which needs Zig 0.17. Encodings are cached per image generation, and a viewer's empty queue takes a repaint whole however large."
    upstream_status: not-submitted
    drop_when: >-
      Upstream herdr-core stores kitty images and replays them to viewers that
      attach, as pixels.
    scope:
      - crates/ghostty-vt/**
      - crates/herdr-core/src/relay.rs
      - crates/herdr-core/THIRD-PARTY-NOTICES
      - Cargo.lock
      - crates/herdr-core/src/wire.rs
      - README.md
      - crates/herdr-core/src/config.rs
      - crates/herdr-core/src/api/run.rs
      - crates/herdr-core/src/runtime.rs
      - crates/herdr-core/src/kept.rs
      - crates/herdr-core/src/viewers.rs
      - crates/herdr-core/src/remote.rs
      - crates/herdr-core/tests/settings.rs
      - vendor/ghostty
      - CONTRIBUTING.md
      - scripts/notices
      - distribution/notices/README.md
  - name: fork-ci
    kind: tooling
    purpose: "Run only the fork's own CI: the upstream workflow on pushes to downstream and pull requests against it, on standard GitHub-hosted runners, newer runs cancelling older ones, with no release publishing."
    upstream_status: "inappropriate: downstream-only CI policy"
    drop_when: The fork is retired.
    scope:
      - .github/workflows/**
  - name: fork-tooling
    kind: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - PATCHES.md
      - patches/downstream/**
      - mise.toml
      - mise.lock
disabled_patches: []
history: []
contracts:
  allow_base: []
  required_text: []
