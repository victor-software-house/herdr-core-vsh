%YAML 1.2
---
schema: 1
downstream:
  remote: origin
  branch: downstream
  recovery_tag_prefix: forkctl/recovery
  publish: append
upstream:
  remote: upstream
  url: https://github.com/herdrdev/herdr-core.git
  fetch_ref: refs/heads/master
base:
  target:
    kind: tag
    selector: refs/tags/v0.1.16
    commit: e07c2a1bedd62cf4787ee026ee23ee79c7d95491
  canonical: e07c2a1bedd62cf4787ee026ee23ee79c7d95491
  stack: e07c2a1bedd62cf4787ee026ee23ee79c7d95491
documents:
  ledger: PATCHES.md
  exports: patches/downstream
bookkeeping_patch: fork-tooling
patches:
  - name: fork-ci
    kind: tooling
    purpose: "Run only the fork's own CI: the upstream workflow on pushes to downstream and pull requests against it, on standard GitHub-hosted runners, newer runs cancelling older ones, with no release publishing."
    upstream_status: "inappropriate: downstream-only CI policy"
    drop_when: The fork is retired.
    scope:
      - .github/workflows/**
  - name: fork-tooling
    kind: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - PATCHES.md
      - patches/downstream/**
      - mise.toml
      - mise.lock
disabled_patches: []
history: []
contracts:
  allow_base: []
  required_text: []
